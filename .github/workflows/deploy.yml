# Build Astro and deploy to Cloudflare Workers
name: Deploy to Cloudflare Workers

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # site-kick is a private repo; this read-only deploy key lets npm ci fetch it over SSH.
      # Fork PRs get no secrets, so their install fails at this point by design.
      - name: Load site-kick deploy key
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.SITE_KICK_DEPLOY_KEY }}
      - name: Install dependencies
        run: npm ci
      - name: Test application contracts
        run: npm test
      - name: Build Astro site
        run: npm run build
      - name: OG build smoke test
        run: npm run og:smoke
      - name: Worker bundle size guard
        run: npm run og:size-guard
      - name: Check production CMS schema before deployment
        if: github.event_name != 'pull_request'
        run: npx emdash migrate --check --wrangler-config wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
